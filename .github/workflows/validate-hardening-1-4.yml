name: Validate hardening 1-4

on:
  push:
    branches:
      - hardening/puntos-1-4-20261003
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck completo
        run: pnpm run typecheck
      - name: Build de producción DigitalOcean
        run: PORT=8080 BASE_PATH=/ pnpm run build:render
