openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Operational PostgreSQL storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /app-storage:
    get:
      operationId: getAppStorage
      tags: [storage]
      summary: Read the complete operational snapshot from PostgreSQL
      responses:
        "200":
          description: Current operational snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStorageResponse"
  /app-storage/sync:
    post:
      operationId: syncAppStorage
      tags: [storage]
      summary: Merge an offline snapshot into PostgreSQL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot:
                  $ref: "#/components/schemas/AppSnapshot"
              required: [snapshot]
      responses:
        "200":
          description: Merged operational snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppStorageResponse"
  /app-storage/assignments:
    get:
      operationId: listAssignments
      tags: [storage]
      summary: Read promoter assignments
      responses:
        "200":
          description: Promoter assignments
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: saveAssignment
      tags: [storage]
      summary: Save one promoter assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Assignment saved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /app-storage/login:
    post:
      operationId: appLogin
      tags: [storage]
      summary: Validate a campaign user against the stored password hash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dni:
                  type: string
                password:
                  type: string
              required: [dni, password]
      responses:
        "200":
          description: Authenticated campaign user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /app-storage/admin/markets:
    post:
      operationId: createAdminMarket
      tags: [storage]
      summary: Create a market manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                market: { $ref: "#/components/schemas/AppRecord" }
              required: [market]
      responses:
        "201":
          description: Market created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/markets/{id}:
    delete:
      operationId: deleteAdminMarket
      tags: [storage]
      summary: Permanently delete a market and its clients
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Market deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/clients:
    post:
      operationId: createAdminClient
      tags: [storage]
      summary: Create a client manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { $ref: "#/components/schemas/AppRecord" }
              required: [client]
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/clients/{id}:
    delete:
      operationId: deleteAdminClient
      tags: [storage]
      summary: Permanently delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Client deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/canjes:
    get:
      operationId: listAdminCanjes
      tags: [storage]
      summary: List inventory and sale canjes
      responses:
        "200":
          description: Canjes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createAdminCanje
      tags: [storage]
      summary: Create an inventory canje manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canje: { $ref: "#/components/schemas/AppRecord" }
              required: [canje]
      responses:
        "201":
          description: Canje created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/canjes/{source}/{id}:
    delete:
      operationId: deleteAdminCanje
      tags: [storage]
      summary: Permanently delete a movement or sale canje
      parameters:
        - name: source
          in: path
          required: true
          schema: { type: string, enum: [movement, sale] }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canje deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
  /app-storage/admin/cleanup:
    post:
      operationId: cleanupAdminCatalogs
      tags: [storage]
      summary: Permanently clear operational data and non-ANALISTA users while preserving ANALISTA users and product prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmation: { type: string }
              required: [confirmation]
      responses:
        "200":
          description: Selected operational data deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStorageResponse" }
components:
  schemas:
    AppRecord:
      type: object
      additionalProperties: true
    AppSnapshot:
      type: object
      properties:
        markets: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        users: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        clients: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        sales: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        attendance: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        inventory: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        movements: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        assignments: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        closures: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
        productPrices: { type: array, items: { $ref: "#/components/schemas/AppRecord" } }
      required: [markets, users, clients, sales, attendance, inventory, movements, assignments, closures, productPrices]
    AppStorageResponse:
      type: object
      properties:
        storage:
          type: string
        snapshot:
          $ref: "#/components/schemas/AppSnapshot"
      required: [storage, snapshot]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

